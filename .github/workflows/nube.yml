# =====================================================================
#  nube.yml — corre el bot en la nube (sin tu PC). Actions → "nube" → Run workflow.
#
#  CUENTAS (una sola vez, y las editas cuando quieras):
#    Settings → Secrets and variables → Actions → New repository secret
#      Nombre:  ED_CUENTAS
#      Valor:   una cuenta por línea →   usuario contraseña Nombre
#               (el Nombre es opcional, solo para reconocerla en el resumen)
#    Ejemplo:
#      hugo123 miClave1 Hugo
#      otro456 otraClave Prueba
#  Al lanzar, en "cuentas" escribe cuáles: 1   ·   2,3   ·   todas
#  NUNCA escribas contraseñas en el formulario de Run workflow ni en el código:
#  en un repo público eso queda visible en los registros. En el secret están cifradas.
#  (Compatibilidad: si ED_CUENTAS no existe, se usa ED_USER_1 / ED_PASS_1.)
# =====================================================================
name: nube
on:
  workflow_dispatch:
    inputs:
      cuentas:
        description: 'Qué cuentas del secret ED_CUENTAS correr: 1 · 2,3 · todas'
        default: 'todas'
      modo:
        description: 'completar = todo el curso y luego tests < 100 · barrer = solo tests < 100 · auto = sigue la lección actual'
        type: choice
        options: [completar, barrer, auto]
        default: completar
      minutos:
        description: 'Minutos de trabajo (máx. 330)'
        default: '330'
      ritmo:
        description: 'Segundos (promedio) entre un paso y otro: ritmo de persona. 5 ≈ 4 h para un curso grande; 0 = lo más rápido'
        default: '5'
  # Para que se relance solo cada 6 h (todas las cuentas), quita el # de las 2 líneas siguientes:
  # schedule:
  #   - cron: '0 */6 * * *'

concurrency:
  group: nube-${{ github.ref }}
  cancel-in-progress: false

# NUEVO v21.13: issues: write → el tablero en vivo (un issue del repo con la tabla de checks de cada cuenta)
permissions:
  contents: read
  issues: write

jobs:
  preparar:
    runs-on: ubuntu-24.04   # fijo: ubuntu-latest pasa a 26 y Playwright 1.48 no lo soporta
    outputs:
      lista: ${{ steps.elegir.outputs.lista }}
      issue: ${{ steps.tablero.outputs.issue }}
    steps:
      - uses: actions/checkout@v4
      - name: Elegir cuentas
        id: elegir
        run: node cloud/cuentas.js lista
        env:
          ED_CUENTAS: ${{ secrets.ED_CUENTAS }}
          HAY_USER_1: ${{ secrets.ED_USER_1 != '' }}
          ELEGIDAS: ${{ github.event.inputs.cuentas || 'todas' }}
      - name: Tablero en vivo (issue del repo)
        id: tablero
        continue-on-error: true
        run: node cloud/tablero.js issue
        env:
          GH_TOKEN: ${{ github.token }}

  correr:
    needs: preparar
    runs-on: ubuntu-24.04   # fijo: ubuntu-latest pasa a 26 y Playwright 1.48 no lo soporta
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        cuenta: ${{ fromJson(needs.preparar.outputs.lista) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Instalar Playwright + Chrome
        run: npm install --no-audit --no-fund --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Recuperar la memoria del bot (ejecución anterior)
        uses: actions/cache/restore@v4
        with:
          path: estado
          key: ed-estado-${{ matrix.cuenta }}-${{ github.run_id }}
          restore-keys: ed-estado-${{ matrix.cuenta }}-
      - name: Recuperar el banco de respuestas (por curso, de todas las cuentas)
        uses: actions/cache/restore@v4
        with:
          path: banco
          key: ed-banco-${{ github.run_id }}
          restore-keys: ed-banco-
      - name: Correr el bot
        run: node cloud/runner.js
        env:
          GH_TOKEN: ${{ github.token }}
          TABLERO_ISSUE: ${{ needs.preparar.outputs.issue }}
          CUENTA: ${{ matrix.cuenta }}
          ED_CUENTAS: ${{ secrets.ED_CUENTAS }}
          ED_USER: ${{ secrets[format('ED_USER_{0}', matrix.cuenta)] }}
          ED_PASS: ${{ secrets[format('ED_PASS_{0}', matrix.cuenta)] }}
          MODO: ${{ github.event.inputs.modo || 'completar' }}
          MINUTOS: ${{ github.event.inputs.minutos || '330' }}
          RITMO: ${{ github.event.inputs.ritmo || '5' }}
      - name: Guardar la memoria del bot
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado
          key: ed-estado-${{ matrix.cuenta }}-${{ github.run_id }}
      - name: Subir reporte y fotos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuenta-${{ matrix.cuenta }}
          path: salida/
          retention-days: 3
      - name: Pasar el banco de esta cuenta al job "juntar"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banco-${{ matrix.cuenta }}
          path: banco/
          retention-days: 1
          if-no-files-found: ignore

  # NUEVO v21.13: junta los bancos de todas las cuentas (por curso) y los guarda en la caché para la próxima corrida
  juntar:
    needs: correr
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Banco anterior
        uses: actions/cache/restore@v4
        with:
          path: banco
          key: ed-banco-${{ github.run_id }}
          restore-keys: ed-banco-
      - name: Bancos de esta corrida
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: banco-*
          path: artefactos
      - name: Juntar por curso
        run: node cloud/banco.js juntar artefactos banco
      - name: Guardar el banco para la próxima corrida
        uses: actions/cache/save@v4
        with:
          path: banco
          key: ed-banco-${{ github.run_id }}
